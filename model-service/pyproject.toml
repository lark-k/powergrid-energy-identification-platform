[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powergrid-model-service"
version = "1.0.0"
description = "Stable model API for SGCC resource identification and PV separation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.138.1",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "pydantic==2.13.4",
  "torch==2.13.0",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
