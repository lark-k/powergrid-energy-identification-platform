name: powergrid-energy-platform

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powergrid}
      POSTGRES_USER: ${POSTGRES_USER:-powergrid_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  model-service:
    build:
      context: ..
      dockerfile: model-service/Dockerfile
    environment:
      MODEL_SERVICE_ENV: development
      SGCC_PROJECT_DIR: /opt/sgcc
      RECOGNITION_CHECKPOINT: /opt/sgcc/energy_device_detection/outputs/selected_model.pt
      SEPARATION_CHECKPOINT: /opt/sgcc/energy_device_detection/pv_outputs/selected_pv_model.pt
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_BATCH_SIZE: ${MODEL_BATCH_SIZE:-256}
      MODEL_INFERENCE_TIMEOUT_SECONDS: ${MODEL_INFERENCE_TIMEOUT_SECONDS:-30}
      MODEL_SERVICE_AUTH_REQUIRED: "true"
      MODEL_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN:-local-model-token-change-me}
    networks: [model-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_MODE: ${SECURITY_MODE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-powergrid}
      DB_USERNAME: ${POSTGRES_USER:-powergrid_dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      MODEL_SERVICE_BASE_URL: http://model-service:8000
      MODEL_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN:-local-model-token-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRINGDOC_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      model-service: { condition: service_healthy }
    networks: [data-network, model-network, frontend-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_SOURCE: api
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend: { condition: service_healthy }
    networks: [frontend-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  frontend-network:
    internal: false
  model-network:
    internal: true
  data-network:
    internal: true

volumes:
  postgres-data:
