spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/powergrid}
    username: ${DB_USERNAME:powergrid_dev}
    password: ${DB_PASSWORD:powergrid_dev_only}
  flyway:
    locations: classpath:db/migration,classpath:db/devdata

platform:
  security:
    mode: dev
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://127.0.0.1:5180}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
